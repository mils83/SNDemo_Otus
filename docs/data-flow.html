<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Потоки данных — Social Network Skeleton</title>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:'Geist',system-ui,-apple-system,sans-serif;
    background:#f5f5f5;color:#2d3142;
    display:flex;justify-content:center;padding:48px 24px;
  }
  .diagram{
    background:#fff;border:1px solid #d8d9df;border-radius:6px;
    max-width:100%;overflow-x:auto;padding:0;
  }
  .card{padding:32px 36px 24px}
  h1{
    font-family:'Instrument Serif',Georgia,serif;font-size:26px;font-weight:400;
    margin:0 0 4px;color:#2d3142;
  }
  .eyebrow{
    font-family:'Geist Mono',monospace;font-size:10px;font-weight:500;
    letter-spacing:.12em;text-transform:uppercase;color:#8b8d98;margin:0 0 8px;
  }
  .desc{font-size:13px;color:#6b6d77;margin:0 0 8px;max-width:640px}
  svg{display:block;min-width:944px}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
<div class="diagram">
<div class="card">
  <p class="eyebrow">Data flow · FastAPI + PostgreSQL</p>
  <h1>Потоки данных</h1>
  <p class="desc">Четыре маршрута клиентского API и их путь до PostgreSQL: регистрация (1), вход (2), получение анкеты (3) и поиск (4). Внутренние вызовы — серые, HTTP — синие, возвраты — пунктир.</p>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 944 736" role="img" aria-labelledby="dfnet-title dfnet-desc" style="min-width:944px">
  <title id="dfnet-title">Потоки данных — Social Network Skeleton</title>
  <desc id="dfnet-desc">Четыре HTTP-маршрута от клиента через FastAPI и пул соединений psycopg2 к PostgreSQL; ответы возвращаются в обратном порядке.</desc>

  <defs>
    <marker id="mk-gray" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="9" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6Z" fill="#8b8d98"/>
    </marker>
    <marker id="mk-blue" viewBox="0 0 10 6" refX="9" refY="3" markerWidth="9" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,3 L0,6Z" fill="#3b6db3"/>
    </marker>
  </defs>

  <!-- ================= ARROWS (before boxes) ================= -->
  <!-- 4 HTTP-запроса: Client → FastAPI, прямые линии на выровненных уровнях -->
  <line x1="184" y1="240" x2="304" y2="240" stroke="#3b6db3" stroke-width="1.5" marker-end="url(#mk-blue)"/>
  <line x1="184" y1="316" x2="304" y2="316" stroke="#3b6db3" stroke-width="1.5" marker-end="url(#mk-blue)"/>
  <line x1="184" y1="392" x2="304" y2="392" stroke="#3b6db3" stroke-width="1.5" marker-end="url(#mk-blue)"/>
  <line x1="184" y1="468" x2="304" y2="468" stroke="#3b6db3" stroke-width="1.5" marker-end="url(#mk-blue)"/>

  <!-- Ответ JSON: FastAPI → Client -->
  <line x1="304" y1="528" x2="184" y2="528" stroke="#3b6db3" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#mk-blue)"/>

  <!-- FastAPI → Auth -->
  <line x1="504" y1="136" x2="592" y2="136" stroke="#8b8d98" stroke-width="1.2" marker-end="url(#mk-gray)"/>

  <!-- FastAPI → DB Pool / назад -->
  <line x1="504" y1="468" x2="592" y2="468" stroke="#8b8d98" stroke-width="1.2" marker-end="url(#mk-gray)"/>
  <line x1="592" y1="528" x2="504" y2="528" stroke="#8b8d98" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#mk-gray)"/>

  <!-- DB Pool → PostgreSQL / назад (сдвинутая пара, 32px) -->
  <line x1="728" y1="488" x2="776" y2="488" stroke="#8b8d98" stroke-width="1.2" marker-end="url(#mk-gray)"/>
  <line x1="776" y1="520" x2="728" y2="520" stroke="#8b8d98" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#mk-gray)"/>

  <!-- ================= ARROW LABELS (с масками, зазор 8px) ================= -->
  <!-- Подписи маршрутов (в свободной зоне x 184..304) -->
  <rect x="212" y="218" width="64" height="14" rx="2" fill="#fff"/>
  <text x="244" y="228" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="9" fill="#3b6db3">1 REGISTER</text>

  <rect x="220" y="294" width="48" height="14" rx="2" fill="#fff"/>
  <text x="244" y="304" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="9" fill="#3b6db3">2 LOGIN</text>

  <rect x="212" y="370" width="64" height="14" rx="2" fill="#fff"/>
  <text x="244" y="380" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="9" fill="#3b6db3">3 GET USER</text>

  <rect x="216" y="446" width="56" height="14" rx="2" fill="#fff"/>
  <text x="244" y="456" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="9" fill="#3b6db3">4 SEARCH</text>

  <!-- JSON-ответ -->
  <rect x="212" y="508" width="64" height="14" rx="2" fill="#fff"/>
  <text x="244" y="518" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="9" fill="#6b6d77">JSON 200</text>

  <!-- Label: Auth (зона x 504..592) -->
  <rect x="510" y="106" width="76" height="14" rx="2" fill="#fff"/>
  <text x="548" y="116" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="9" fill="#6b6d77">BCRYPT / JWT</text>

  <!-- Labels: DB Pool -->
  <rect x="520" y="446" width="56" height="14" rx="2" fill="#fff"/>
  <text x="548" y="456" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="9" fill="#6b6d77">GETCONN()</text>

  <rect x="528" y="506" width="40" height="14" rx="2" fill="#fff"/>
  <text x="548" y="516" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="9" fill="#6b6d77">RESULT</text>

  <!-- Labels: PostgreSQL (зона x 728..776) -->
  <rect x="737" y="466" width="30" height="14" rx="2" fill="#fff"/>
  <text x="752" y="476" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="9" fill="#6b6d77">SQL</text>

  <rect x="735" y="526" width="34" height="14" rx="2" fill="#fff"/>
  <text x="752" y="536" text-anchor="middle" font-family="'Geist Mono',monospace" font-size="9" fill="#6b6d77">ROWS</text>

  <!-- ================= NODES ================= -->

  <!-- Client -->
  <rect x="32" y="176" width="152" height="376" rx="6" fill="#fff" stroke="#d8d9df"/>
  <rect x="32" y="176" width="152" height="24" rx="6" fill="#eef0f4"/>
  <rect x="32" y="196" width="152" height="4" fill="#eef0f4"/>
  <text x="44" y="192" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="1" fill="#6b6d77">HTTP CLIENT</text>
  <text x="44" y="222" font-family="Geist,sans-serif" font-weight="600" font-size="14" fill="#2d3142">Client</text>
  <text x="44" y="240" font-family="'Geist Mono',monospace" font-size="9" fill="#8b8d98">postman / curl</text>

  <!-- FastAPI (фокус — акцент) -->
  <rect x="304" y="88" width="200" height="472" rx="6" fill="#fff" stroke="#bf4520" stroke-width="1.5"/>
  <rect x="304" y="88" width="200" height="24" rx="6" fill="#bf4520"/>
  <rect x="304" y="108" width="200" height="4" fill="#bf4520"/>
  <text x="316" y="104" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="1" fill="#fff">APP :8000</text>
  <text x="316" y="162" font-family="Geist,sans-serif" font-weight="600" font-size="14" fill="#2d3142">FastAPI</text>
  <text x="316" y="180" font-family="'Geist Mono',monospace" font-size="9" fill="#8b8d98">main.py · uvicorn</text>

  <!-- Auth -->
  <rect x="592" y="104" width="176" height="104" rx="6" fill="#fff" stroke="#d8d9df"/>
  <rect x="592" y="104" width="176" height="24" rx="6" fill="#eef0f4"/>
  <rect x="592" y="124" width="176" height="4" fill="#eef0f4"/>
  <text x="604" y="120" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="1" fill="#6b6d77">auth.py</text>
  <text x="604" y="168" font-family="Geist,sans-serif" font-weight="600" font-size="14" fill="#2d3142">Auth</text>
  <text x="604" y="186" font-family="'Geist Mono',monospace" font-size="9" fill="#8b8d98">bcrypt · JWT HS256</text>

  <!-- DB Pool -->
  <rect x="592" y="352" width="136" height="272" rx="6" fill="#fff" stroke="#d8d9df"/>
  <rect x="592" y="352" width="136" height="24" rx="6" fill="#eef0f4"/>
  <rect x="592" y="372" width="136" height="4" fill="#eef0f4"/>
  <text x="604" y="368" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="1" fill="#6b6d77">database.py</text>
  <text x="604" y="412" font-family="Geist,sans-serif" font-weight="600" font-size="14" fill="#2d3142">DB Pool</text>
  <text x="604" y="430" font-family="'Geist Mono',monospace" font-size="9" fill="#8b8d98">psycopg2 · 1..20</text>
  <!-- SQL-операции по маршрутам -->
  <text x="604" y="486" font-family="'Geist Mono',monospace" font-size="8.5" fill="#2d3142">1 INSERT USERS</text>
  <text x="604" y="514" font-family="'Geist Mono',monospace" font-size="8.5" fill="#2d3142">2 SELECT HASH</text>
  <text x="604" y="542" font-family="'Geist Mono',monospace" font-size="8.5" fill="#2d3142">3 SELECT BY ID</text>
  <text x="604" y="570" font-family="'Geist Mono',monospace" font-size="8.5" fill="#2d3142">4 SELECT LIKE</text>

  <!-- PostgreSQL -->
  <rect x="776" y="448" width="136" height="112" rx="6" fill="#fff" stroke="#d8d9df"/>
  <rect x="776" y="448" width="136" height="24" rx="6" fill="#eef0f4"/>
  <rect x="776" y="468" width="136" height="4" fill="#eef0f4"/>
  <text x="788" y="464" font-family="'Geist Mono',monospace" font-size="8" letter-spacing="1" fill="#6b6d77">POSTGRES:18</text>
  <text x="788" y="516" font-family="Geist,sans-serif" font-weight="600" font-size="14" fill="#2d3142">PostgreSQL</text>
  <text x="788" y="534" font-family="'Geist Mono',monospace" font-size="9" fill="#8b8d98">social_network</text>

  <!-- ================= LEGEND (нижняя полоса) ================= -->
  <line x1="32" y1="700" x2="80" y2="700" stroke="#3b6db3" stroke-width="1.5" marker-end="url(#mk-blue)"/>
  <text x="90" y="704" font-family="Geist,sans-serif" font-size="11" fill="#6b6d77">HTTP-запрос</text>

  <line x1="220" y1="700" x2="268" y2="700" stroke="#8b8d98" stroke-width="1.2" marker-end="url(#mk-gray)"/>
  <text x="278" y="704" font-family="Geist,sans-serif" font-size="11" fill="#6b6d77">внутренний вызов</text>

  <line x1="452" y1="700" x2="500" y2="700" stroke="#8b8d98" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#mk-gray)"/>
  <text x="510" y="704" font-family="Geist,sans-serif" font-size="11" fill="#6b6d77">результат / возврат</text>

  <text x="32" y="726" font-family="'Geist Mono',monospace" font-size="9" fill="#8b8d98">1 POST /user/register · 2 POST /login · 3 GET /user/get/{id} · 4 GET /user/search</text>
</svg>
</div>
</div>
</body>
</html>
